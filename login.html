<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Samen Reisplanner · Inloggen</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-main">
      <section class="card auth-card">
        <p class="eyebrow">Family Travel OS</p>
        <h1>Inloggen</h1>
        <p class="muted">Log in om de planner te gebruiken en activiteiten te koppelen aan jouw account.</p>
        <form id="login-form" class="grid-form">
          <input id="username" type="text" placeholder="Gebruikersnaam" required />
          <input id="password" type="password" placeholder="Wachtwoord" required />
          <button type="submit">Inloggen</button>
        </form>
        <p id="login-error" class="muted"></p>
        <p class="muted">Demo users: <strong>jij</strong> / <strong>partner</strong> (wachtwoord: <strong>reis123</strong>)</p>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="app-login.js"></script>
  </body>
</html>
